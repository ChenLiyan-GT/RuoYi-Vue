<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改级别规则')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-levelRule-edit">
            <input type="hidden" name="ruleId" th:value="${levelRule.ruleId}">
            <div class="form-group">
                <label class="col-sm-3 control-label">职能类型：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="positionTypeId" id="positionTypeId" required>
                        <option value="">---请选择---</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">职级：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="level" id="level" th:value="${levelRule.level}" min="1" max="10" required>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 范围：1-10（P1~P10）</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">可执行最小阶段：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="minStage" id="minStage" required>
                        <option value="1" th:selected="${levelRule.minStage} == 1">需求分析</option>
                        <option value="2" th:selected="${levelRule.minStage} == 2">基本设计</option>
                        <option value="3" th:selected="${levelRule.minStage} == 3">内部设计</option>
                        <option value="4" th:selected="${levelRule.minStage} == 4">开发</option>
                        <option value="5" th:selected="${levelRule.minStage} == 5">单体测试</option>
                        <option value="6" th:selected="${levelRule.minStage} == 6">结合测试</option>
                        <option value="7" th:selected="${levelRule.minStage} == 7">综合测试</option>
                        <option value="8" th:selected="${levelRule.minStage} == 8">上线</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">可执行最大阶段：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="maxStage" id="maxStage" required>
                        <option value="1" th:selected="${levelRule.maxStage} == 1">需求分析</option>
                        <option value="2" th:selected="${levelRule.maxStage} == 2">基本设计</option>
                        <option value="3" th:selected="${levelRule.maxStage} == 3">内部设计</option>
                        <option value="4" th:selected="${levelRule.maxStage} == 4">开发</option>
                        <option value="5" th:selected="${levelRule.maxStage} == 5">单体测试</option>
                        <option value="6" th:selected="${levelRule.maxStage} == 6">结合测试</option>
                        <option value="7" th:selected="${levelRule.maxStage} == 7">综合测试</option>
                        <option value="8" th:selected="${levelRule.maxStage} == 8">上线</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">描述：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="description" id="description" rows="3" th:text="${levelRule.description}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <label class="toggle-switch switch-solid">
                        <input type="checkbox" id="status" name="status" th:checked="${levelRule.status} == '0'">
                        <span></span>
                    </label>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/levelRule";

        $(function() {
            loadPositionTypes();
            // 验证最大阶段必须大于等于最小阶段
            $("#form-levelRule-edit").on("change", "#minStage", function() {
                var minStage = parseInt($(this).val());
                var maxStage = parseInt($("#maxStage").val());
                if (maxStage < minStage) {
                    $("#maxStage").val(minStage);
                }
            });
        });

        function loadPositionTypes() {
            $.ajax({
                url: ctx + "system/work/positionType/listAll",
                type: "get",
                success: function(result) {
                    if (result.code == 0) {
                        var options = '<option value="">---请选择---</option>';
                        $.each(result.rows, function(i, item) {
                            var selected = item.positionTypeId == [[${levelRule.positionTypeId}]] ? 'selected' : '';
                            options += '<option value="' + item.positionTypeId + '" ' + selected + '>' + item.positionTypeName + '</option>';
                        });
                        $("#positionTypeId").html(options);
                    }
                }
            });
        }

        $("#form-levelRule-edit").validate({
            rules: {
                positionTypeId: {
                    required: true
                },
                level: {
                    required: true,
                    digits: true,
                    min: 1,
                    max: 10
                },
                minStage: {
                    required: true,
                    digits: true,
                    min: 1,
                    max: 8
                },
                maxStage: {
                    required: true,
                    digits: true,
                    min: 1,
                    max: 8
                }
            },
            messages: {
                positionTypeId: {
                    required: "请选择职能类型"
                },
                level: {
                    required: "请输入职级",
                    digits: "职级必须是整数",
                    min: "职级最小为 1",
                    max: "职级最大为 10"
                },
                minStage: {
                    required: "请选择可执行最小阶段"
                },
                maxStage: {
                    required: "请选择可执行最大阶段"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var data = $("#form-levelRule-edit").serializeArray();
                data.push({name: "status", value: $("#status").is(":checked") ? "0" : "1"});
                $.operate.save(prefix + "/edit", data);
            }
        }
    </script>
</body>
</html>
