<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增级别规则')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-levelRule-add">
            <div class="form-group">
                <label class="col-sm-3 control-label">职能类型：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="positionTypeId" id="positionTypeId" required>
                        <option value="">---请选择---</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">职级：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="level" id="level" min="1" max="10" required>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 范围：1-10（P1~P10）</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">可执行最小阶段：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="minStage" id="minStage" required>
                        <option value="1">需求分析</option>
                        <option value="2">基本设计</option>
                        <option value="3">内部设计</option>
                        <option value="4">开发</option>
                        <option value="5">单体测试</option>
                        <option value="6">结合测试</option>
                        <option value="7">综合测试</option>
                        <option value="8">上线</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">可执行最大阶段：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="maxStage" id="maxStage" required>
                        <option value="1">需求分析</option>
                        <option value="2">基本设计</option>
                        <option value="3">内部设计</option>
                        <option value="4">开发</option>
                        <option value="5">单体测试</option>
                        <option value="6">结合测试</option>
                        <option value="7">综合测试</option>
                        <option value="8">上线</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">描述：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="description" id="description" rows="3"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <label class="toggle-switch switch-solid">
                        <input type="checkbox" id="status" name="status" checked>
                        <span></span>
                    </label>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/levelRule";

        $(function() {
            loadPositionTypes();
            // 验证最大阶段必须大于等于最小阶段
            $("#form-levelRule-add").on("change", "#minStage", function() {
                var minStage = parseInt($(this).val());
                var maxStage = parseInt($("#maxStage").val());
                if (maxStage < minStage) {
                    $("#maxStage").val(minStage);
                }
            });
            $("#form-levelRule-add").on("change", "#maxStage", function() {
                var maxStage = parseInt($(this).val());
                var minStage = parseInt($("#minStage").val());
                if (minStage > maxStage) {
                    $("#minStage").val(maxStage);
                }
            });
        });

        function loadPositionTypes() {
            $.ajax({
                url: ctx + "system/work/positionType/listAll",
                type: "get",
                success: function(result) {
                    if (result.code == 0) {
                        var options = '<option value="">---请选择---</option>';
                        $.each(result.data, function(i, item) {
                            options += '<option value="' + item.typeId + '">' + item.typeName + '</option>';
                        });
                        $("#positionTypeId").html(options);
                    }
                }
            });
        }

        $("#form-levelRule-add").validate({
            rules: {
                positionTypeId: {
                    required: true
                },
                level: {
                    required: true,
                    digits: true,
                    min: 1,
                    max: 10
                },
                minStage: {
                    required: true,
                    digits: true,
                    min: 1,
                    max: 8
                },
                maxStage: {
                    required: true,
                    digits: true,
                    min: 1,
                    max: 8
                }
            },
            messages: {
                positionTypeId: {
                    required: "请选择职能类型"
                },
                level: {
                    required: "请输入职级",
                    digits: "职级必须是整数",
                    min: "职级最小为 1",
                    max: "职级最大为 10"
                },
                minStage: {
                    required: "请选择可执行最小阶段"
                },
                maxStage: {
                    required: "请选择可执行最大阶段"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var data = $("#form-levelRule-add").serializeArray();
                data = data.filter(function(item) { return item.name !== 'status'; });
                data.push({name: "status", value: $("#status").is(":checked") ? "0" : "1"});
                $.operate.save(prefix + "/add", data);
            }
        }
    </script>
</body>
</html>
