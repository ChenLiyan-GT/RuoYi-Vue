<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('作业阶段模板列表')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>模板名称：</label>
                                <input type="text" name="templateName"/>
                            </li>
                            <li>
                                <label>适用部门：</label>
                                <select name="deptId" class="form-control">
                                    <option value="">---请选择---</option>
                                </select>
                            </li>
                            <li>
                                <label>状态：</label>
                                <select name="status" class="form-control">
                                    <option value="">---请选择---</option>
                                    <option value="0">正常</option>
                                    <option value="1">停用</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" shiro:hasPermission="system:work:stageTemplate:add">
                <a class="btn btn-success" onclick="$.operate.add()">
                    <i class="fa fa-plus"></i> 新增
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-info" onclick="setAsDefault()">
                    <i class="fa fa-star"></i> 设为默认
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>

    <!-- 阶段配置弹窗 -->
    <div class="modal fade" id="stageConfigModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">阶段配置</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="stageConfigContainer"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="saveStageConfig()">保存配置</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/stageTemplate";
        var addFlag = [[${@permission.hasPermi('system:work:stageTemplate:add')}]];
        var editFlag = [[${@permission.hasPermi('system:work:stageTemplate:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:work:stageTemplate:remove')}]];
        var datas = [[${@dict.getType('sys_normal_disable')}]];

        var stageNames = ['需求分析', '基本设计', '内部设计', '开发', '单体测试', '结合测试', '综合测试', '上线'];
        var stageRatios = [5, 10, 10, 40, 15, 10, 5, 5]; // 默认工时占比

        $(function() {
            loadDepts();
        });

        function loadDepts() {
            $.ajax({
                url: ctx + "system/dept/list",
                type: "post",
                success: function(result) {
                    var options = '<option value="">---请选择---</option>';
                    // 构建部门名 -> 上级部门名 的映射
                    var deptMap = {};
                    $.each(result, function(i, item) {
                        deptMap[item.deptId] = item;
                    });
                    $.each(result, function(i, item) {
                        var label = item.deptName;
                        if (item.parentId && deptMap[item.parentId]) {
                            label = deptMap[item.parentId].deptName + '-' + label;
                        }
                        options += '<option value="' + item.deptId + '">' + label + '</option>';
                    });
                    $("select[name='deptId']").html(options);
                }
            });
        }

        $.table.init({
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "作业阶段模板",
            columns: [{
                checkbox: true
            }, {
                field: 'templateId',
                title: '模板 ID',
                visible: false
            }, {
                field: 'templateName',
                title: '模板名称',
                sortable: true
            }, {
                field: 'deptName',
                title: '适用部门'
            }, {
                field: 'stagesConfig',
                title: '阶段配置',
                width: '35%',
                formatter: function(value, row, index) {
                    if (!value) return '';
                    try {
                        var stages = JSON.parse(value);
                        var html = '';
                        $.each(stages, function(i, stage) {
                            html += '<span class="badge badge-info" style="margin:2px;">' + stage.stage_name + '(' + Math.round(stage.workload_ratio * 100) + '%)</span> ';
                        });
                        return html;
                    } catch(e) {
                        return value;
                    }
                }
            }, {
                field: 'isDefault',
                title: '默认模板',
                formatter: function(value, row, index) {
                    return value == '1' ? '<span class="badge badge-danger">是</span>' : '<span class="badge badge-secondary">否</span>';
                }
            }, {
                field: 'status',
                title: '状态',
                formatter: function(value, row, index) {
                    return $.table.selectDictLabel(datas, value);
                }
            }, {
                title: '操作',
                align: 'center',
                formatter: function(value, row, index) {
                    var actions = [];
                    actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.templateId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                    actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="configStages(\'' + row.templateId + '\', \'' + row.stagesConfig + '\')"><i class="fa fa-cog"></i>配置</a> ');
                    actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.templateId + '\')"><i class="fa fa-remove"></i>删除</a> ');
                    return actions.join('');
                }
            }]
        });

        function configStages(templateId, stageConfig) {
            var html = '<div class="form-horizontal">';
            html += '<div class="form-group"><label class="col-sm-2 control-label">阶段选择：</label><div class="col-sm-10">';
            for (var i = 0; i < stageNames.length; i++) {
                html += '<label class="checkbox-inline"><input type="checkbox" name="stage_' + (i+1) + '" value="' + (i+1) + '" checked> ' + stageNames[i] + '</label> ';
            }
            html += '</div></div>';
            html += '<div class="form-group"><label class="col-sm-2 control-label">工时占比：</label><div class="col-sm-10">';
            for (var i = 0; i < stageNames.length; i++) {
                html += '<div class="input-group" style="width:150px;display:inline-block;margin:5px;">';
                html += '<span class="input-group-addon">' + stageNames[i] + '</span>';
                html += '<input type="number" class="form-control" name="ratio_' + (i+1) + '" value="' + stageRatios[i] + '" min="0" max="100">';
                html += '</div>';
            }
            html += '</div></div></div>';
            $('#stageConfigContainer').html(html);
            $('#stageConfigModal').modal('show');
        }

        function saveStageConfig() {
            // 保存阶段配置逻辑
            $('#stageConfigModal').modal('hide');
        }

        function setAsDefault() {
            var row = $.table.getFirstSelectedRow();
            if (!row) {
                $.modal.alertWarning("请选择一条记录");
                return;
            }
            $.modal.confirm("确认将该模板设为默认模板吗？", function() {
                $.operate.post(prefix + "/setDefault/" + row.templateId);
            });
        }
    </script>
</body>
</html>
