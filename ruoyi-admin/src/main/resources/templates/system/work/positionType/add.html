<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增职能类型')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-positionType-add">
            <div class="form-group">
                <label class="col-sm-3 control-label">职能类型编码：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="typeCode" id="typeCode" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">职能类型名称：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="typeName" id="typeName" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">描述：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="remark" id="remark" rows="3"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">排序：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="sortOrder" id="sortOrder" value="0">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <label class="toggle-switch switch-solid">
                        <input type="checkbox" id="status" name="status" checked>
                        <span></span>
                    </label>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/positionType";

        $("#form-positionType-add").validate({
            rules: {
                typeCode: {
                    required: true,
                    remote: {
                        url: prefix + "/checkTypeCodeUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            typeCode: function() {
                                return $.common.trim($("#typeCode").val());
                            }
                        }
                    }
                },
                typeName: {
                    required: true
                },
                sortOrder: {
                    digits: true
                }
            },
            messages: {
                typeCode: {
                    required: "请输入职能类型编码",
                    remote: "职能类型编码已存在"
                },
                typeName: {
                    required: "请输入职能类型名称"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var data = $("#form-positionType-add").serializeArray();
                data = data.filter(function(item) { return item.name !== 'status'; });
                data.push({name: "status", value: $("#status").is(":checked") ? "0" : "1"});
                $.operate.save(prefix + "/add", data);
            }
        }
    </script>
</body>
</html>
