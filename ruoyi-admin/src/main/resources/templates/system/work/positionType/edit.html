<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改职能类型')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-positionType-edit">
            <input type="hidden" name="positionTypeId" th:value="${positionType.positionTypeId}">
            <div class="form-group">
                <label class="col-sm-3 control-label">职能类型编码：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="positionTypeCode" id="positionTypeCode" th:value="${positionType.positionTypeCode}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">职能类型名称：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="positionTypeName" id="positionTypeName" th:value="${positionType.positionTypeName}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">描述：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="description" id="description" rows="3" th:text="${positionType.description}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">排序：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="sortOrder" id="sortOrder" th:value="${positionType.sortOrder}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <label class="toggle-switch switch-solid">
                        <input type="checkbox" id="status" name="status" th:checked="${positionType.status} == '0'">
                        <span></span>
                    </label>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/positionType";

        $("#form-positionType-edit").validate({
            rules: {
                positionTypeCode: {
                    required: true,
                    remote: {
                        url: prefix + "/checkPositionTypeCodeUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            positionTypeId: function() {
                                return $("#form-positionType-edit input[name='positionTypeId']").val();
                            },
                            positionTypeCode: function() {
                                return $.common.trim($("#positionTypeCode").val());
                            }
                        }
                    }
                },
                positionTypeName: {
                    required: true
                },
                sortOrder: {
                    digits: true
                }
            },
            messages: {
                positionTypeCode: {
                    required: "请输入职能类型编码",
                    remote: "职能类型编码已存在"
                },
                positionTypeName: {
                    required: "请输入职能类型名称"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var data = $("#form-positionType-edit").serializeArray();
                data.push({name: "status", value: $("#status").is(":checked") ? "0" : "1"});
                $.operate.save(prefix + "/edit", data);
            }
        }
    </script>
</body>
</html>
