<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('工时记录列表')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>作业编号：</label>
                                <input type="text" name="jobNo"/>
                            </li>
                            <li>
                                <label>员工姓名：</label>
                                <input type="text" name="employeeName"/>
                            </li>
                            <li>
                                <label>登记日期：</label>
                                <input type="text" name="workDate" class="time-input" placeholder="选择日期" style="width: 240px;">
                            </li>
                            <li>
                                <label>审核状态：</label>
                                <select name="status" class="form-control">
                                    <option value="">---请选择---</option>
                                    <option value="0">草稿</option>
                                    <option value="1">已提交</option>
                                    <option value="2">已通过</option>
                                    <option value="3">已驳回</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" shiro:hasPermission="system:work:timesheet:add">
                <a class="btn btn-success" onclick="$.operate.add()">
                    <i class="fa fa-plus"></i> 新增
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-info" onclick="batchAudit()">
                    <i class="fa fa-check"></i> 批量审核
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/timesheet";
        var addFlag = [[${@permission.hasPermi('system:work:timesheet:add')}]];
        var editFlag = [[${@permission.hasPermi('system:work:timesheet:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:work:timesheet:remove')}]];

        var statusNames = {
            '0': '<span class="badge badge-info">草稿</span>',
            '1': '<span class="badge badge-warning">已提交</span>',
            '2': '<span class="badge badge-success">已通过</span>',
            '3': '<span class="badge badge-danger">已驳回</span>'
        };

        $(function() {
            $(".time-input").datetimepicker({
                format: "yyyy-mm-dd",
                minView: "month",
                language: "zh-CN",
                autoclose: true
            });
        });

        $.table.init({
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "工时记录",
            columns: [{
                checkbox: true
            }, {
                field: 'timesheetId',
                title: '记录 ID',
                visible: false
            }, {
                field: 'jobNo',
                title: '作业编号'
            }, {
                field: 'jobName',
                title: '作业名称'
            }, {
                field: 'stageName',
                title: '阶段名称'
            }, {
                field: 'employeeName',
                title: '员工姓名'
            }, {
                field: 'workDate',
                title: '工作日期',
                sortable: true
            }, {
                field: 'workload',
                title: '工时',
                sortable: true,
                formatter: function(value, row, index) {
                    return value != null ? value : '-';
                }
            }, {
                field: 'content',
                title: '工作内容',
                width: '20%',
                formatter: function(value, row, index) {
                    return value ? (value.length > 30 ? value.substring(0, 30) + '...' : value) : '-';
                }
            }, {
                field: 'status',
                title: '审核状态',
                formatter: function(value, row, index) {
                    return statusNames[value] || value;
                }
            }, {
                field: 'auditTime',
                title: '审核日期',
                formatter: function(value, row, index) {
                    return value ? value : '-';
                }
            }, {
                field: 'auditBy',
                title: '审核人',
                formatter: function(value, row, index) {
                    return value ? value : '-';
                }
            }, {
                field: 'auditComment',
                title: '审核意见',
                formatter: function(value, row, index) {
                    return value ? (value.length > 20 ? value.substring(0, 20) + '...' : value) : '-';
                }
            }, {
                title: '操作',
                align: 'center',
                formatter: function(value, row, index) {
                    var actions = [];
                    if (row.status === '1') {
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="auditPass(\'' + row.timesheetId + '\')"><i class="fa fa-check"></i>通过</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="auditReject(\'' + row.timesheetId + '\')"><i class="fa fa-times"></i>驳回</a> ');
                    }
                    if (row.status === '0') {
                        actions.push('<a class="btn btn-info btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.timesheetId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                    }
                    actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.timesheetId + '\')"><i class="fa fa-remove"></i>删除</a> ');
                    return actions.join('');
                }
            }]
        });

        function auditPass(timesheetId) {
            $.modal.prompt("请输入审核意见（可选）：", function(auditComment) {
                $.operate.post(prefix + "/approve/" + timesheetId, { auditComment: auditComment || '' });
            });
        }

        function auditReject(timesheetId) {
            $.modal.prompt("请输入驳回原因：", function(auditComment) {
                if (!auditComment) {
                    $.modal.alertWarning("请输入驳回原因");
                    return;
                }
                $.operate.post(prefix + "/reject/" + timesheetId, { auditComment: auditComment });
            });
        }

        function batchAudit() {
            var rows = $.table.selectColumns("timesheetId");
            if (rows.length == 0) {
                $.modal.alertWarning("请选择记录");
                return;
            }
            $.modal.confirm("确认批量审核选中的 " + rows.length + " 条记录吗？", function() {
                $.operate.post(prefix + "/batchAudit", { timesheetIds: rows.join(',') });
            });
        }
    </script>
</body>
</html>
