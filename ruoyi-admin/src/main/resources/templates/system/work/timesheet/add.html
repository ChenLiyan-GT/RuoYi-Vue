<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增工时记录')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-timesheet-add">
            <div class="form-group">
                <label class="col-sm-3 control-label">所属作业：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="jobId" id="jobId" required>
                        <option value="">---请选择作业---</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">作业阶段：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="stageId" id="stageId" required>
                        <option value="">---请先选择作业---</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">分配记录：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="assignId" id="assignId" required>
                        <option value="">---请先选择阶段---</option>
                    </select>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 选择已分配给自己的工作记录</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">工作日期：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="workDate" id="workDate" placeholder="选择工作日期" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">工时：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="workload" id="workload" step="0.5" min="0.5" max="24" required>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 范围：0.5-24 小时</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">工作内容：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="content" id="content" rows="4" required placeholder="请详细描述今日完成的工作内容"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="remark" id="remark" rows="2"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/timesheet";

        $(function() {
            loadJobs();
            initDatePickers();
            
            // 作业选择变化时加载阶段
            $("#jobId").change(function() {
                loadStages($(this).val());
            });
            
            // 阶段选择变化时加载分配记录
            $("#stageId").change(function() {
                loadAssignments($(this).val());
            });
        });

        function loadJobs() {
            $.ajax({
                url: ctx + "system/work/job/listMyJobs",
                type: "get",
                success: function(result) {
                    if (result.code == 0) {
                        var options = '<option value="">---请选择作业---</option>';
                        $.each(result.rows, function(i, item) {
                            options += '<option value="' + item.jobId + '">' + item.jobNo + ' - ' + item.jobName + '</option>';
                        });
                        $("#jobId").html(options);
                    }
                }
            });
        }

        function loadStages(jobId) {
            $.ajax({
                url: ctx + "system/work/jobStage/listByJob/" + jobId,
                type: "get",
                success: function(result) {
                    if (result.code == 0) {
                        var options = '<option value="">---请选择阶段---</option>';
                        $.each(result.rows, function(i, item) {
                            options += '<option value="' + item.stageId + '">' + item.stageName + '</option>';
                        });
                        $("#stageId").html(options);
                    }
                }
            });
        }

        function loadAssignments(stageId) {
            $.ajax({
                url: ctx + "system/work/assignment/listByStage/" + stageId,
                type: "get",
                success: function(result) {
                    if (result.code == 0) {
                        var options = '<option value="">---请选择分配记录---</option>';
                        $.each(result.rows, function(i, item) {
                            options += '<option value="' + item.assignId + '">' + item.employeeName + ' - ' + item.planWorkload + '工时</option>';
                        });
                        $("#assignId").html(options);
                    }
                }
            });
        }

        function initDatePickers() {
            $("#workDate").datetimepicker({
                format: "yyyy-mm-dd",
                minView: "month",
                language: "zh-CN",
                autoclose: true,
                endDate: new Date()
            });
        }

        $("#form-timesheet-add").validate({
            rules: {
                jobId: {
                    required: true
                },
                stageId: {
                    required: true
                },
                assignId: {
                    required: true
                },
                workDate: {
                    required: true
                },
                workload: {
                    required: true,
                    number: true,
                    min: 0.5,
                    max: 24
                },
                content: {
                    required: true,
                    minlength: 10
                }
            },
            messages: {
                jobId: {
                    required: "请选择所属作业"
                },
                stageId: {
                    required: "请选择作业阶段"
                },
                assignId: {
                    required: "请选择分配记录"
                },
                workDate: {
                    required: "请选择工作日期"
                },
                workload: {
                    required: "请输入工时",
                    min: "工时最小为 0.5 小时",
                    max: "工时最大为 24 小时"
                },
                content: {
                    required: "请输入工作内容",
                    minlength: "工作内容至少 10 个字符"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $("#form-timesheet-add").serializeArray());
            }
        }
    </script>
</body>
</html>
