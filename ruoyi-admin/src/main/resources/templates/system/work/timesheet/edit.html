<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改工时记录')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-timesheet-edit">
            <input type="hidden" name="timesheetId" th:value="${timesheet.timesheetId}">
            <div class="form-group">
                <label class="col-sm-3 control-label">作业编号：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" th:value="${timesheet.jobNo}" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">作业阶段：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" th:value="${timesheet.stageName}" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">员工姓名：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" th:value="${timesheet.employeeName}" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">工作日期：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="workDate" id="workDate" th:value="${timesheet.workDate}" placeholder="选择工作日期" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">工时：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="workload" th:value="${timesheet.workload}" step="0.5" min="0.5" max="24" required>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 范围：0.5-24 小时</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">工作内容：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="content" id="content" rows="4" required th:text="${timesheet.content}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">审核状态：</label>
                <div class="col-sm-8">
                    <span class="form-control-static" th:text="${#strings.equals(timesheet.status, '0') ? '草稿' : (#strings.equals(timesheet.status, '1') ? '已提交' : (#strings.equals(timesheet.status, '2') ? '已通过' : '已驳回'))}"></span>
                </div>
            </div>
            <div class="form-group" th:if="${timesheet.auditBy}">
                <label class="col-sm-3 control-label">审核人：</label>
                <div class="col-sm-8">
                    <span class="form-control-static" th:text="${timesheet.auditBy}"></span>
                </div>
            </div>
            <div class="form-group" th:if="${timesheet.auditTime}">
                <label class="col-sm-3 control-label">审核时间：</label>
                <div class="col-sm-8">
                    <span class="form-control-static" th:text="${timesheet.auditTime}"></span>
                </div>
            </div>
            <div class="form-group" th:if="${timesheet.auditComment}">
                <label class="col-sm-3 control-label">审核意见：</label>
                <div class="col-sm-8">
                    <span class="form-control-static" th:text="${timesheet.auditComment}"></span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="remark" id="remark" rows="2" th:text="${timesheet.remark}"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/timesheet";

        $(function() {
            initDatePickers();
        });

        function initDatePickers() {
            $("#workDate").datetimepicker({
                format: "yyyy-mm-dd",
                minView: "month",
                language: "zh-CN",
                autoclose: true,
                endDate: new Date()
            });
        }

        $("#form-timesheet-edit").validate({
            rules: {
                workDate: {
                    required: true
                },
                workload: {
                    required: true,
                    number: true,
                    min: 0.5,
                    max: 24
                },
                content: {
                    required: true,
                    minlength: 10
                }
            },
            messages: {
                workDate: {
                    required: "请选择工作日期"
                },
                workload: {
                    required: "请输入工时",
                    min: "工时最小为 0.5 小时",
                    max: "工时最大为 24 小时"
                },
                content: {
                    required: "请输入工作内容",
                    minlength: "工作内容至少 10 个字符"
                }
            },
            focusCleanup: true,
            submitHandler: function(form) {
                // 已提交或已审核的记录不允许修改
                var status = [[${timesheet.status}]];
                if (status !== '0') {
                    $.modal.alertWarning("已提交或已审核的记录不允许修改");
                    return false;
                }
                $.operate.save(prefix + "/edit", $(form).serializeArray());
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                var status = [[${timesheet.status}]];
                if (status !== '0') {
                    $.modal.alertWarning("已提交或已审核的记录不允许修改");
                    return;
                }
                $.operate.save(prefix + "/edit", $("#form-timesheet-edit").serializeArray());
            }
        }
    </script>
</body>
</html>
