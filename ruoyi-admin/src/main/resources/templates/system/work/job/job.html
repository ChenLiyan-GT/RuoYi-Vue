<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('作业管理列表')" />
    <th:block th:include="include :: layoutGrid" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>作业编号：</label>
                                <input type="text" name="jobNo"/>
                            </li>
                            <li>
                                <label>作业名称：</label>
                                <input type="text" name="jobName"/>
                            </li>
                            <li>
                                <label>所属部门：</label>
                                <select name="deptId" class="form-control">
                                    <option value="">---请选择---</option>
                                </select>
                            </li>
                            <li>
                                <label>作业状态：</label>
                                <select name="jobStatus" class="form-control">
                                    <option value="">---请选择---</option>
                                    <option value="0">未开始</option>
                                    <option value="1">进行中</option>
                                    <option value="2">已完成</option>
                                    <option value="3">已暂停</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" shiro:hasPermission="system:work:job:add">
                <a class="btn btn-success" onclick="$.operate.add()">
                    <i class="fa fa-plus"></i> 新增
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-info" onclick="copyFromTemplate()">
                    <i class="fa fa-copy"></i> 从模板创建
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>

    <!-- 从模板创建弹窗 -->
    <div class="modal fade" id="templateModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">从模板创建作业</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>选择模板：</label>
                        <select class="form-control" id="templateSelect">
                            <option value="">---请选择模板---</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>作业名称：</label>
                        <input type="text" class="form-control" id="jobNameInput">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="createJobFromTemplate()">创建</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/job";
        var addFlag = [[${@permission.hasPermi('system:work:job:add')}]];
        var editFlag = [[${@permission.hasPermi('system:work:job:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:work:job:remove')}]];

        $(function() {
            loadDepts();
        });

        function loadDepts() {
            $.ajax({
                url: ctx + "system/dept/list",
                type: "get",
                success: function(result) {
                    if (result.code == 0) {
                        var options = '<option value="">---请选择---</option>';
                        $.each(result.rows, function(i, item) {
                            options += '<option value="' + item.deptId + '">' + item.deptName + '</option>';
                        });
                        $("select[name='deptId']").html(options);
                    }
                }
            });
        }

        $.table.init({
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "作业",
            columns: [{
                checkbox: true
            }, {
                field: 'jobId',
                title: '作业 ID',
                visible: false
            }, {
                field: 'jobNo',
                title: '作业编号',
                sortable: true
            }, {
                field: 'jobName',
                title: '作业名称'
            }, {
                field: 'deptName',
                title: '所属部门'
            }, {
                field: 'totalWorkload',
                title: '总工时',
                sortable: true
            }, {
                field: 'actualWorkload',
                title: '已用工时',
                formatter: function(value, row, index) {
                    return (value || 0) + ' / ' + (row.totalWorkload || 0);
                }
            }, {
                field: 'progress',
                title: '进度',
                formatter: function(value, row, index) {
                    var percent = value || 0;
                    return '<div class="progress progress-sm"><div class="progress-bar progress-bar-striped" style="width:' + percent + '%"></div></div>' + percent + '%';
                }
            }, {
                field: 'jobStatus',
                title: '状态',
                formatter: function(value, row, index) {
                    if (value === '0') return '<span class="badge badge-secondary">未开始</span>';
                    if (value === '1') return '<span class="badge badge-primary">进行中</span>';
                    if (value === '2') return '<span class="badge badge-success">已完成</span>';
                    if (value === '3') return '<span class="badge badge-warning">已暂停</span>';
                    return value;
                }
            }, {
                field: 'startDate',
                title: '开始日期',
                sortable: true
            }, {
                field: 'endDate',
                title: '预计完成日期',
                sortable: true
            }, {
                title: '操作',
                align: 'center',
                formatter: function(value, row, index) {
                    var actions = [];
                    actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.jobId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                    actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="viewStages(\'' + row.jobId + '\')"><i class="fa fa-list"></i>阶段</a> ');
                    actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.jobId + '\')"><i class="fa fa-remove"></i>删除</a> ');
                    return actions.join('');
                }
            }]
        });

        function copyFromTemplate() {
            loadTemplates();
            $('#templateModal').modal('show');
        }

        function loadTemplates() {
            $.ajax({
                url: prefix + "/listTemplates",
                type: "get",
                success: function(result) {
                    if (result.code == 0) {
                        var options = '<option value="">---请选择模板---</option>';
                        $.each(result.rows, function(i, item) {
                            options += '<option value="' + item.templateId + '">' + item.templateName + '</option>';
                        });
                        $("#templateSelect").html(options);
                    }
                }
            });
        }

        function createJobFromTemplate() {
            var templateId = $("#templateSelect").val();
            var jobName = $("#jobNameInput").val();
            if (!templateId) {
                $.modal.alertWarning("请选择模板");
                return;
            }
            if (!jobName) {
                $.modal.alertWarning("请输入作业名称");
                return;
            }
            $.operate.post(prefix + "/createFromTemplate", {
                templateId: templateId,
                jobName: jobName
            });
        }

        function viewStages(jobId) {
            var url = prefix + "/stages/" + jobId;
            $.modal.openTab("作业阶段", url);
        }
    </script>
</body>
</html>
