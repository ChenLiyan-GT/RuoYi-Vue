<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改进度更新记录')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-progressLog-edit">
            <input type="hidden" name="logId" th:value="${progressLog.logId}">
            <div class="form-group">
                <label class="col-sm-3 control-label">作业编号：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" th:value="${progressLog.jobNo}" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">作业阶段：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" th:value="${progressLog.stageName}" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">进度类型：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="progressType" required>
                        <option value="0" th:selected="${progressLog.progressType} == '0'">阶段开始</option>
                        <option value="1" th:selected="${progressLog.progressType} == '1'">进度更新</option>
                        <option value="2" th:selected="${progressLog.progressType} == '2'">阶段完成</option>
                        <option value="3" th:selected="${progressLog.progressType} == '3'">风险预警</option>
                        <option value="4" th:selected="${progressLog.progressType} == '4'">问题报告</option>
                        <option value="5" th:selected="${progressLog.progressType} == '5'">其他</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">进度百分比：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="progressPercent" th:value="${progressLog.progressPercent}" min="0" max="100">
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 范围：0-100%</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">进度描述：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="progressDesc" id="progressDesc" rows="4" required th:text="${progressLog.progressDesc}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">更新人员：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" th:value="${progressLog.updateBy}" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">更新时间：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" th:value="${progressLog.updateTime}" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" name="remark" id="remark" rows="2" th:text="${progressLog.remark}"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/work/progressLog";

        $("#form-progressLog-edit").validate({
            rules: {
                progressType: {
                    required: true
                },
                progressPercent: {
                    number: true,
                    min: 0,
                    max: 100
                },
                progressDesc: {
                    required: true,
                    minlength: 10
                }
            },
            messages: {
                progressType: {
                    required: "请选择进度类型"
                },
                progressDesc: {
                    required: "请输入进度描述",
                    minlength: "进度描述至少 10 个字符"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $("#form-progressLog-edit").serializeArray());
            }
        }
    </script>
</body>
</html>
